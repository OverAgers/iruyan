name: Go

on:
  push:
    branches: ["staging"]
  pull_request:
    branches: ["staging"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Build
        working-directory: ./iruyan-api
        run: go build -v ./...

      - name: Test
        working-directory: ./iruyan-api
        run: go test -v ./...
