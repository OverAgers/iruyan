name: Go

on:
  push:
    branches: ["staging"]
  pull_request:
    branches: ["staging"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.57.2
          working-directory: ./iruyan-api
          args: --out-format=colored-line-number

      - name: Build
        working-directory: ./iruyan-api
        run: |
          echo "🔨 Building..."
          go build -v ./...

      - name: Test
        working-directory: ./iruyan-api
        run: |
          echo "🧪 Running tests..."
          go test -v -failfast ./...
