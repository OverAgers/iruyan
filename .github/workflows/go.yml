name: Go

on:
  push:
    branches: ["staging"]
  pull_request:
    branches: ["staging"]

env:
  WORKING_DIRECTORY: ./iruyan-api

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.WORKING_DIRECTORY }}/go.mod
          cache: true
          cache-dependency-path: |
            **/go.sum
            **/go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.57.2
          working-directory: ${{ env.WORKING_DIRECTORY }}
          args: --out-format=colored-line-number --timeout=5m

      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "🔨 Building..."
          go build -v ./...

      - name: Test
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "🧪 Running tests..."
          go test -v -failfast ./...
