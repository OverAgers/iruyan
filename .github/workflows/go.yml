name: Backend CI

on:
  push:
    branches: [production, staging]
    paths:
      - "iruyan-api/**"
  pull_request:
    branches: [production, staging]
    paths:
      - "iruyan-api/**"

env:
  WORKING_DIRECTORY: ./iruyan-api

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.WORKING_DIRECTORY }}/go.mod
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run Tests (gotestsum)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          $HOME/go/bin/gotestsum --format=standard-verbose -- ./...

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.WORKING_DIRECTORY }}/go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.64.8
          working-directory: ${{ env.WORKING_DIRECTORY }}
          args: --config=.golangci.v1.yml --out-format=colored-line-number --timeout=5m

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.WORKING_DIRECTORY }}/go.mod
          cache: true

      - name: Build application
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: go build -v ./...

  deploy-preview:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.WORKING_DIRECTORY }}/go.mod
          cache: true

      - name: Test build for preview
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: go build -v ./...

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Backend CI checks passed!**\n\nThe Go backend has been tested, linted, and built successfully. Ready for review 🚀'
            })
