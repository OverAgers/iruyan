version: "3"

tasks:
  default:
    desc: "タスク一覧を表示"
    cmds:
      - task --list

  setup:
    desc: "aqua によるツールインストール"
    silent: true
    cmds:
      - echo "📦 aqua による CLI ツールのインストールを開始..."
      - aqua i
      - echo "✅ ツールのインストールが完了しました"

  swag:
    desc: "Docker内のbackendでSwaggerドキュメントを生成"
    cmds:
      - docker compose exec backend /bin/sh -c "/go/bin/swag init -g main.go -o ./docs"

  test-auth:
    desc: "handlers/auth の認証テストを実行（gotestsum 使用、ASCII表示）"
    cmds:
      - echo "🔍 handlers/auth/auth_handler_test.go を gotestsum でテスト中..."
      - gotestsum --format=standard-verbose -- -run '^Test.*' ./handlers/auth

  lint:
    desc: "ローカルで golangci-lint を実行（標準出力付き）"
    cmds:
      - echo "🔎 golangci-lint を実行中..."
      - golangci-lint run --config=.golangci.yml
