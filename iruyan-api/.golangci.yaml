# .golangci.yml - golangci-lint の設定ファイル
# プロジェクトごとの静的解析ルールをここで定義できます。

run:
  timeout: 5m # タイムアウト時間（解析に時間がかかる大規模プロジェクト向けに調整可能）
  tests: true # test ファイルも含めて lint を行う
  skip-dirs:
    - tmp # 一時ディレクトリなど、lint の対象外にするディレクトリ
  skip-files:
    - ".*.gen.go" # 自動生成ファイルなどのスキップパターン（正規表現可）

linters:
  enable:
    - govet # Go公式の基本的な問題検出ツール
    - staticcheck # より強力な静的解析（未使用コードや誤用などを検出）
    - gofmt # gofmt による整形漏れ検出
    - goimports # import の順序や未使用検出
    - gocritic # 一般的なコードスタイルやバグの検出
    - errcheck # エラーハンドリング漏れを検出
    - revive # 高度に設定可能な lint ツール（golint の上位互換）

  disable:
    - golint # コメント必須ルールが厳しすぎるため無効化（必要なら外してください）

linters-settings:
  gofmt:
    simplify: true # 冗長なコードを簡素化していない場合にもエラーとする

  revive:
    confidence: 0.8 # 重要度の高い警告のみ対象（0.0〜1.0）
    severity: warning # メッセージの出力レベルを warning に設定（error にも変更可）
    rules:
      - name: indent-error-flow
      - name: var-naming
      - name: package-comments

issues:
  exclude-use-default: false # デフォルトの除外ルールも使用する
  exclude-rules:
    - path: _test\.go # test ファイルではコメントがなくても許容
      linters:
        - revive
    - text: "should have comment or be unexported"
      linters:
        - revive # コメント強制ルールを無視したい場合に追加

# 解析対象の Go バージョン（省略可）
# go: "1.23"
