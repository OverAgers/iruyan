basePath: /
definitions:
  models.User:
    properties:
      email:
        type: string
      id:
        type: integer
      iruyanID:
        type: string
      name:
        type: string
      password:
        description: ハッシュ化されたパスワード
        type: string
    type: object
  responses.DailyWorkLogResponseSwagger:
    properties:
      date:
        type: string
      hours:
        type: string
    type: object
  responses.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  responses.GetRecentLogResponseSwagger:
    properties:
      message:
        type: string
      userId:
        type: string
      workTimeLog:
        items:
          $ref: '#/definitions/responses.WorkTimeLogSwagger'
        type: array
    type: object
  responses.LeaveRoomResponseSwagger:
    properties:
      duration:
        description: e.g., "1h2m3s"
        type: string
      entryTime:
        description: ISO8601表記想定
        type: string
      iruyanId:
        type: string
      leavingTime:
        description: ISO8601表記想定
        type: string
      message:
        type: string
      roomId:
        type: string
      roomName:
        type: string
    type: object
  responses.LoginSuccessResponse:
    properties:
      message:
        type: string
      user:
        $ref: '#/definitions/responses.UserInfo'
    type: object
  responses.LogoutSuccessResponse:
    properties:
      message:
        type: string
      user:
        $ref: '#/definitions/responses.UserInfo'
    type: object
  responses.RegisterSuccessResponse:
    properties:
      message:
        type: string
      user:
        $ref: '#/definitions/responses.UserInfo'
    type: object
  responses.RoomActionResponse:
    properties:
      message:
        type: string
      roomId:
        type: string
    type: object
  responses.RoomCreateResponse:
    properties:
      message:
        type: string
      roomId:
        type: string
      roomName:
        type: string
    type: object
  responses.RoomDetail:
    properties:
      roomId:
        type: string
      roomName:
        type: string
      seats:
        items:
          $ref: '#/definitions/responses.SeatDetail'
        type: array
    type: object
  responses.RoomDetailResponse:
    properties:
      message:
        type: string
      roomId:
        type: string
    type: object
  responses.RoomListResponse:
    properties:
      message:
        type: string
      rooms:
        items:
          $ref: '#/definitions/responses.RoomDetail'
        type: array
    type: object
  responses.SeatDetail:
    properties:
      roomId:
        type: string
      seatId:
        type: string
      seatNumber:
        type: integer
    type: object
  responses.User:
    properties:
      email:
        type: string
      iruyanId:
        type: string
      name:
        type: string
    type: object
  responses.UserInfo:
    properties:
      email:
        type: string
      iruyanId:
        type: string
      userName:
        type: string
    type: object
  responses.WorkLogForLastWeekResponseSwagger:
    properties:
      dailyLogs:
        items:
          $ref: '#/definitions/responses.DailyWorkLogResponseSwagger'
        type: array
      userId:
        type: integer
    type: object
  responses.WorkTimeListResponseSwagger:
    properties:
      work_times:
        items:
          $ref: '#/definitions/responses.WorkTimeResponseSwagger'
        type: array
    type: object
  responses.WorkTimeLogSwagger:
    properties:
      duration:
        type: string
      entryTime:
        type: string
      leavingTime:
        type: string
    type: object
  responses.WorkTimeResponseSwagger:
    properties:
      duration:
        description: formatted like "1h23m"
        type: string
      entryTime:
        description: RFC3339
        type: string
      iruyanId:
        type: string
      leavingTime:
        description: RFC3339 or nil
        type: string
      roomId:
        type: string
      task:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a server for IRUYAN.
  title: IRUYAN API
  version: "1.0"
paths:
  /login:
    get:
      description: Displays the login page with a message
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Show login page
      tags:
      - auth
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Authenticates the user based on iruyanID and password
      parameters:
      - default: johndoe
        description: Iruyan ID
        in: formData
        name: iruyanId
        required: true
        type: string
      - default: pass1234
        description: Password
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.LoginSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: User login
      tags:
      - auth
  /logout:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Logs out the user based on provided IruyanID
      parameters:
      - default: johndoe
        description: Iruyan ID
        in: formData
        name: iruyanId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.LogoutSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: User logout
      tags:
      - auth
  /register:
    get:
      description: Displays the registration page with a message
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Show registration page
      tags:
      - auth
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Registers a new user with the provided details
      parameters:
      - default: johndoe
        description: Iruyan ID
        in: formData
        name: iruyanId
        required: true
        type: string
      - default: pass1234
        description: Password
        in: formData
        name: password
        required: true
        type: string
      - default: John Doe
        description: Name
        in: formData
        name: userName
        required: true
        type: string
      - default: johndoe@example.com
        description: Email
        in: formData
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.RegisterSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: User registration
      tags:
      - auth
  /rooms:
    get:
      description: Retrieves a list of rooms, each with associated seat information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.RoomListResponse'
      summary: Get list of rooms with seats
      tags:
      - rooms
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Creates a room with the provided name
      parameters:
      - default: RoomA
        description: Room Name
        in: formData
        name: roomName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.RoomCreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Create a new room
      tags:
      - room
  /rooms/{roomId}:
    get:
      description: Retrieves the details of a specific room
      parameters:
      - description: Room ID
        in: path
        name: roomId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.RoomDetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Get room details
      tags:
      - room
  /rooms/{roomId}/enter/{iruyanId}:
    post:
      consumes:
      - application/json
      description: Records the entry time of a user entering a specific room and stores
        the entry information in WorkTime.
      parameters:
      - description: Room ID
        in: path
        name: roomId
        required: true
        type: string
      - default: johndoe
        description: Iruyan ID
        in: path
        name: iruyanId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Entered the room successfully
          schema:
            $ref: '#/definitions/responses.RoomActionResponse'
        "404":
          description: Room not found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Failed to record entry to the room
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Enter a room
      tags:
      - room
  /rooms/{roomId}/leave:
    post:
      description: Allows a user to leave a specific room and records the leaving
        time
      parameters:
      - description: Room ID
        in: path
        name: roomId
        required: true
        type: string
      - default: johndoe
        description: Iruyan ID
        in: formData
        name: iruyanId
        required: true
        type: string
      - default: 1h2m3s
        description: Duration (e.g., 1h2m3s)
        in: formData
        name: duration
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Left the room successfully
          schema:
            $ref: '#/definitions/responses.LeaveRoomResponseSwagger'
        "400":
          description: Invalid duration format or other validation errors
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Room or user not found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Failed to record leaving time
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Leave a room
      tags:
      - room
  /rooms/{roomId}/seat/{seatNumber}/leave:
    put:
      consumes:
      - application/x-www-form-urlencoded
      description: ユーザーが現在着席中の座席から離れます。
      parameters:
      - description: Room UUID
        in: path
        name: roomId
        required: true
        type: string
      - description: Seat Number
        in: path
        name: seatNumber
        required: true
        type: integer
      - description: Iruyan ID（ユーザー識別子）
        in: formData
        name: iruyanId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 離席成功時のレスポンス
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ユーザーが着席していない、または指定された座席と一致しない場合
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: ユーザーが存在しない場合
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: サーバ内部エラー
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: ユーザーが座席から離席する
      tags:
      - seat
  /rooms/{roomId}/seat/{seatNumber}/take:
    put:
      consumes:
      - application/x-www-form-urlencoded
      description: 指定された部屋・座席番号にユーザーを着席させます。
      parameters:
      - description: Room UUID
        in: path
        name: roomId
        required: true
        type: string
      - description: Seat Number
        in: path
        name: seatNumber
        required: true
        type: integer
      - description: Iruyan ID（ユーザー識別子）
        in: formData
        name: iruyanId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 着席成功時のレスポンス
          schema:
            additionalProperties: true
            type: object
        "400":
          description: リクエスト形式や座席不整合時
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: ユーザーまたは座席が存在しない場合
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "409":
          description: 座席がすでに他ユーザーに使用されている場合
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: サーバ内部エラー
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: ユーザーが座席に着席する
      tags:
      - seat
  /user/{iruyanId}:
    get:
      description: Display user page for a specific user ID
      parameters:
      - description: Iruyan ID
        in: path
        name: iruyanId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Show user page
      tags:
      - user
  /user/{iruyanId}/delete:
    delete:
      description: Delete user by ID
      parameters:
      - description: UIruyan ID
        in: path
        name: iruyanId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete a user
      tags:
      - user
  /user/{iruyanId}/ranking:
    get:
      description: Returns focus ranking of the user
      parameters:
      - description: Iruyan ID
        in: path
        name: iruyanId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get user ranking
      tags:
      - user
  /user/{iruyanId}/recent_log:
    get:
      description: Returns the latest 5 work logs for the user (Duration as ISO 8601
        format string)
      parameters:
      - description: Iruyan ID
        in: path
        name: iruyanId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetRecentLogResponseSwagger'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Get user's recent work logs
      tags:
      - user
  /user/{iruyanId}/task:
    post:
      description: Updates the user's current task for ongoing work session
      parameters:
      - description: User ID
        in: path
        name: iruyanId
        required: true
        type: integer
      - description: Task Description
        in: formData
        name: task
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Update current task
      tags:
      - user
  /user/{iruyanId}/together:
    get:
      description: Returns mock together time
      parameters:
      - description: Iruyan ID
        in: path
        name: iruyanId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get time spent together
      tags:
      - user
  /user/{iruyanId}/work_info:
    get:
      description: Retrieve user's work logs grouped by day (Duration as ISO 8601
        format string)
      parameters:
      - description: Iruyan ID
        in: path
        name: iruyanId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.WorkLogForLastWeekResponseSwagger'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Get user's work log for the past week
      tags:
      - user
  /user/fetch/{iruyanId}:
    get:
      description: Retrieves a user based on the provided Iruyan ID
      parameters:
      - description: Iruyan ID
        in: path
        name: iruyanId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Get user by Iruyan ID
      tags:
      - user
  /user/fetch/all:
    get:
      description: Retrieves a list of all registered users
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/responses.User'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Get all users
      tags:
      - user
  /worktime/entry:
    post:
      description: Creates a work time record when a user enters a room
      parameters:
      - default: johndoe
        description: Iruyan ID
        in: formData
        name: iruyanId
        required: true
        type: string
      - description: Room UUID
        in: formData
        name: roomId
        required: true
        type: string
      - description: Task description
        in: formData
        name: task
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.WorkTimeResponseSwagger'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Record entry time
      tags:
      - worktime
  /worktime/fetch/{iruyanId}:
    get:
      description: Retrieves all work time records for a user identified by iruyanID
      parameters:
      - default: johndoe
        description: Iruyan ID
        in: path
        name: iruyanId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.WorkTimeListResponseSwagger'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Get WorkTime records for a specific user
      tags:
      - worktime
  /worktime/fetch/all:
    get:
      description: Retrieves all work time records from the database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.WorkTimeListResponseSwagger'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Get all WorkTime records
      tags:
      - worktime
  /worktime/latest:
    get:
      description: Retrieves the latest work time record for a user that has not ended
        (leaving_time is null)
      parameters:
      - default: johndoe
        description: Iruyan ID
        in: query
        name: iruyanId
        required: true
        type: string
      - description: Room UUID
        in: query
        name: roomId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.WorkTimeResponseSwagger'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Get latest active entry
      tags:
      - worktime
  /worktime/recent:
    get:
      description: Retrieves the most recent N work time records for a user
      parameters:
      - default: johndoe
        description: Iruyan ID
        in: query
        name: iruyanId
        required: true
        type: string
      - default: 5
        description: Number of records to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/responses.WorkTimeResponseSwagger'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Get recent work logs
      tags:
      - worktime
  /worktime/weekly:
    get:
      description: Retrieves all work time records from the past 7 days for a user
      parameters:
      - default: johndoe
        description: Iruyan ID
        in: query
        name: iruyanId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/responses.WorkTimeResponseSwagger'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Get weekly work logs
      tags:
      - worktime
swagger: "2.0"
