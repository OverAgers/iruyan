basePath: /
definitions:
  responses.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  responses.LeaveRoomResponseSwagger:
    properties:
      duration:
        description: e.g., "1h2m3s"
        type: string
      entryTime:
        description: ISO8601表記想定
        type: string
      leavingTime:
        description: ISO8601表記想定
        type: string
      message:
        type: string
      roomId:
        type: string
      roomName:
        type: string
      userId:
        type: string
    type: object
  responses.LoginSuccessResponse:
    properties:
      message:
        type: string
      user:
        $ref: '#/definitions/responses.UserInfo'
    type: object
  responses.LogoutSuccessResponse:
    properties:
      message:
        type: string
      user:
        $ref: '#/definitions/responses.UserInfo'
    type: object
  responses.RegisterSuccessResponse:
    properties:
      message:
        type: string
      user:
        $ref: '#/definitions/responses.UserInfo'
    type: object
  responses.RoomActionResponse:
    properties:
      message:
        type: string
      roomId:
        type: string
    type: object
  responses.RoomCreateResponse:
    properties:
      message:
        type: string
      roomId:
        type: string
      roomName:
        type: string
    type: object
  responses.RoomDetail:
    properties:
      roomId:
        type: string
      roomName:
        type: string
      seats:
        items:
          $ref: '#/definitions/responses.SeatDetail'
        type: array
    type: object
  responses.RoomDetailResponse:
    properties:
      message:
        type: string
      roomId:
        type: string
    type: object
  responses.RoomListResponse:
    properties:
      message:
        type: string
      rooms:
        items:
          $ref: '#/definitions/responses.RoomDetail'
        type: array
    type: object
  responses.SeatDetail:
    properties:
      roomId:
        type: string
      seatId:
        type: string
      seatNumber:
        type: integer
    type: object
  responses.UserInfo:
    properties:
      email:
        type: string
      iruyanId:
        type: string
      userName:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a server for IRUYAN.
  title: IRUYAN API
  version: "1.0"
paths:
  /login:
    get:
      description: Displays the login page with a message
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Show login page
      tags:
      - auth
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Authenticates the user based on iruyanID and password
      parameters:
      - default: johndoe
        description: Iruyan ID
        in: formData
        name: iruyanId
        required: true
        type: string
      - default: pass1234
        description: Password
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.LoginSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: User login
      tags:
      - auth
  /logout:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Logs out the user based on provided IruyanID
      parameters:
      - default: johndoe
        description: Iruyan ID
        in: formData
        name: iruyanId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.LogoutSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: User logout
      tags:
      - auth
  /register:
    get:
      description: Displays the registration page with a message
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Show registration page
      tags:
      - auth
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Registers a new user with the provided details
      parameters:
      - default: johndoe
        description: Iruyan ID
        in: formData
        name: iruyanId
        required: true
        type: string
      - default: pass1234
        description: Password
        in: formData
        name: password
        required: true
        type: string
      - default: John Doe
        description: Name
        in: formData
        name: userName
        required: true
        type: string
      - default: johndoe@example.com
        description: Email
        in: formData
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.RegisterSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: User registration
      tags:
      - auth
  /rooms:
    get:
      description: Retrieves a list of rooms, each with associated seat information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.RoomListResponse'
      summary: Get list of rooms with seats
      tags:
      - rooms
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Creates a room with the provided name
      parameters:
      - default: RoomA
        description: Room Name
        in: formData
        name: roomName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.RoomCreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Create a new room
      tags:
      - room
  /rooms/{roomId}:
    get:
      description: Retrieves the details of a specific room
      parameters:
      - description: Room ID
        in: path
        name: roomId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.RoomDetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Get room details
      tags:
      - room
  /rooms/{roomId}/enter/{iruyanId}:
    post:
      consumes:
      - application/json
      description: Records the entry time of a user entering a specific room and stores
        the entry information in WorkTime.
      parameters:
      - description: Room ID
        in: path
        name: roomId
        required: true
        type: string
      - default: johndoe
        description: Iruyan ID
        in: path
        name: iruyanId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Entered the room successfully
          schema:
            $ref: '#/definitions/responses.RoomActionResponse'
        "404":
          description: Room not found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Failed to record entry to the room
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Enter a room
      tags:
      - room
  /rooms/{roomId}/leave:
    post:
      description: Allows a user to leave a specific room and records the leaving
        time
      parameters:
      - description: Room ID
        in: path
        name: roomId
        required: true
        type: string
      - default: johndoe
        description: Iruyan ID
        in: formData
        name: iruyanId
        required: true
        type: string
      - default: 1h2m3s
        description: Duration (e.g., 1h2m3s)
        in: formData
        name: duration
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Left the room successfully
          schema:
            $ref: '#/definitions/responses.LeaveRoomResponseSwagger'
        "400":
          description: Invalid duration format or other validation errors
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: Room or user not found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Failed to record leaving time
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Leave a room
      tags:
      - room
swagger: "2.0"
